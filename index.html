<!DOCTYPE html>
<head>
    <title>윤동주의 서시</title>
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            width: 960px;
            margin: 0 auto;
            overflow: hidden;
        }

        #section {
            padding: 100px;
            line-height: 1.8;
        }

        @media screen and (max-width: 767px) {
            body { width: auto; }
        }
    </style>
</head>
  
<body>
    <div id="section">
        <h2>서시</h2>
        <p><strong>윤동주</strong></p>
        <br>
        <p>죽는 날까지 하늘을 우러러<br>
        한 점 부끄럼이 없기를,<br>
        잎새에 이는 바람에도<br>
        나는 괴로워했다.</p>
        <br>
        별을 노래하는 마음으로<br>
        모든 죽어가는 것을 사랑해야지<br>
        그리고 나한테 주어진 길을<br>
        걸어가야겠다.</p>
        <br>
        <p>오늘 밤에도 별이 바람에 스치운다.</p>
    </div>
</body>
</html>
